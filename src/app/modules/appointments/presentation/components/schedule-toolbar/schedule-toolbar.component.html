<section class="schedule-toolbar">
  <div class="schedule-toolbar__navigation">
    <button class="schedule-toolbar__nav-button" type="button" aria-label="Periodo anterior" (click)="previous.emit()">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M10 4L6 8L10 12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="schedule-toolbar__today-button" type="button" (click)="today.emit()">Hoy</button>
    <button class="schedule-toolbar__nav-button" type="button" aria-label="Periodo siguiente" (click)="next.emit()">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <span class="schedule-toolbar__range">{{ dateRangeLabel() }}</span>
  </div>

  <label class="schedule-toolbar__search">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
      <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.5"/>
      <path d="M12.5 12.5L16 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <input
      type="search"
      placeholder="Paciente, empresa o profesional"
      [value]="searchQuery()"
      (input)="searchInput.emit($event)"
    />
  </label>

  <label class="schedule-toolbar__select-field">
    <span class="schedule-toolbar__select-label">Estado</span>
    <select [value]="statusFilter()" (change)="onStatusFilterChange($event)">
      @for (option of statusOptions; track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
  </label>

  <label class="schedule-toolbar__select-field">
    <span class="schedule-toolbar__select-label">Doctor</span>
    <select [value]="doctorFilter()" (change)="onDoctorFilterChange($event)">
      <option value="all">Todos</option>
      @for (doctor of professionals(); track doctor) {
        <option [value]="doctor">{{ doctor }}</option>
      }
    </select>
  </label>
</section>

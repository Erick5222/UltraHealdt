<section class="dashboard-stats">
  @for (stat of stats; track stat.label) {
    <uh-dashboard-stat-card
      [icon]="stat.icon"
      [label]="stat.label"
      [value]="stat.value"
      [badge]="stat.badge"
      [badgeTone]="stat.badgeTone"
      [accentTone]="stat.accentTone"
      [iconTone]="stat.iconTone"
    />
  }
</section>

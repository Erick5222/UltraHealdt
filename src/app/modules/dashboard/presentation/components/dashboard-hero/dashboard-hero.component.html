<section class="dashboard-hero">
  <div class="dashboard-hero__content">
    <p class="dashboard-hero__eyebrow">Panel de Control</p>
    <h1 class="dashboard-hero__title">Bienvenido, Dr. Arzuaga</h1>
    <p class="dashboard-hero__description">
      Usted tiene 12 citas programadas para hoy y 4 reportes pendientes de firma
      electrónica.
    </p>
  </div>
  
  <div class="dashboard-hero__actions">
    <button class="dashboard-hero__button dashboard-hero__button--primary" type="button">
      <span class="dashboard-hero__button-icon dashboard-hero__button-icon--primary">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path
            d="M7 1V13M1 7H13"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </span>
      <span>Nueva Consulta</span>
    </button>

    <button class="dashboard-hero__button dashboard-hero__button--secondary" type="button">
      <img
        class="dashboard-hero__button-image"
        src="/images/icons/Dashboard/Agent.svg"
        alt=""
        width="15"
        height="17"
      />
      <span>Ver Agenda</span>
    </button>
  </div>
</section>

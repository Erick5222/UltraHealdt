<section class="reports-filters" aria-label="Filtros de reportes">
  <div class="reports-filters__field">
    <span class="reports-filters__label">Rango de fechas</span>
    <div class="reports-filters__control reports-filters__control--date" (click)="openDatePicker()">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <rect x="2.5" y="3.5" width="11" height="10" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
        <path d="M2.5 6.5H13.5M5.5 2V4.5M10.5 2V4.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      <span class="reports-filters__date-label">{{ dateRangeLabel() }}</span>
      <input
        #dateStartInput
        class="reports-filters__date-input"
        type="date"
        [value]="filters().dateStart"
        (click)="$event.stopPropagation()"
        (change)="dateStartChange.emit($any($event.target).value)"
        aria-label="Fecha inicial"
      />
      <input
        class="reports-filters__date-input reports-filters__date-input--end"
        type="date"
        [value]="filters().dateEnd"
        (click)="$event.stopPropagation()"
        (change)="dateEndChange.emit($any($event.target).value)"
        aria-label="Fecha final"
      />
    </div>
  </div>

  <div class="reports-filters__field">
    <label class="reports-filters__label" for="reports-company">Empresa</label>
    <div class="reports-filters__control">
      <select
        id="reports-company"
        class="reports-filters__select"
        [value]="filters().company"
        (change)="companyChange.emit($any($event.target).value)"
      >
        @for (option of companyOptions(); track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>
  </div>

  <div class="reports-filters__field">
    <label class="reports-filters__label" for="reports-doctor">Médico</label>
    <div class="reports-filters__control">
      <select
        id="reports-doctor"
        class="reports-filters__select"
        [value]="filters().doctor"
        (change)="doctorChange.emit($any($event.target).value)"
      >
        @for (option of doctorOptions(); track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>
  </div>

  <div class="reports-filters__field">
    <label class="reports-filters__label" for="reports-exam-type">Tipo de Examen</label>
    <div class="reports-filters__control">
      <select
        id="reports-exam-type"
        class="reports-filters__select"
        [value]="filters().examType"
        (change)="examTypeChange.emit($any($event.target).value)"
      >
        @for (option of examTypeOptions(); track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>
  </div>

  <div class="reports-filters__field reports-filters__field--status">
    <span class="reports-filters__label">Estado</span>
    <div class="reports-filters__status-row">
      <button class="reports-filters__status-badge" type="button" (click)="statusCycle.emit()">
        {{ statusLabel() }}
      </button>
      <button class="reports-filters__filter-icon" type="button" aria-label="Cambiar estado" (click)="statusCycle.emit()">
        <img src="/images/icons/Empresas/filtros.svg" alt="" width="18" height="18" />
      </button>
    </div>
  </div>
</section>

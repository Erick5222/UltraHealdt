<section class="vital-signs">
  <header class="vital-signs__header">
    <div class="vital-signs__title-wrap">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <path d="M2 9H5L7 4L10 14L12 9H16" stroke="#0058BE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h2 class="vital-signs__title">Signos Vitales</h2>
    </div>
    <span class="vital-signs__timestamp">Última toma: 08:45 AM</span>
  </header>

  <div class="vital-signs__grid">
    <article class="vital-signs__item">
      <span class="vital-signs__label">Peso</span>
      <p class="vital-signs__value">78.5 <small>kg</small></p>
    </article>
    <article class="vital-signs__item">
      <span class="vital-signs__label">Talla</span>
      <p class="vital-signs__value">1.78 <small>m</small></p>
    </article>
    <article class="vital-signs__item vital-signs__item--highlight">
      <span class="vital-signs__label">IMC</span>
      <p class="vital-signs__value">25.3</p>
      <span class="vital-signs__badge">Sobrepeso G1</span>
    </article>
    <article class="vital-signs__item">
      <span class="vital-signs__label">Presión</span>
      <p class="vital-signs__value">120/80 <small>mmHg</small></p>
    </article>
    <article class="vital-signs__item">
      <span class="vital-signs__label">FC</span>
      <p class="vital-signs__value">72 <small>bpm</small></p>
    </article>
    <article class="vital-signs__item">
      <span class="vital-signs__label">Temp</span>
      <p class="vital-signs__value">36.5 <small>°C</small></p>
    </article>
  </div>
</section>

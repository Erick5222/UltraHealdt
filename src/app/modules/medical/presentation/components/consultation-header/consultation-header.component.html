<header class="consultation-header">
  <div class="consultation-header__main">
    <p class="consultation-header__eyebrow">Atención Médica Ocupacional</p>
    <h1 class="consultation-header__title">Detalle de Consulta</h1>
    <div class="consultation-header__meta">
      <span class="consultation-header__chip">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="8" cy="5" r="2.5" stroke="currentColor" stroke-width="1.2"/>
          <path d="M3.5 14C4.2 11.5 5.9 10 8 10C10.1 10 11.8 11.5 12.5 14" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        Juan Pablo Rodriguez
      </span>
      <span class="consultation-header__chip">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <rect x="2" y="3" width="12" height="11" rx="2" stroke="currentColor" stroke-width="1.2"/>
          <path d="M2 7H14M5 1V4M11 1V4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        24 Oct, 2023
      </span>
      <span class="consultation-header__chip">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <rect x="2" y="4" width="12" height="10" rx="2" stroke="currentColor" stroke-width="1.2"/>
          <path d="M8 7V10M6.5 8.5H9.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        Dra. Elena Rivas
      </span>
    </div>
  </div>

  <div class="consultation-header__evaluation">
    <span class="consultation-header__evaluation-label">Tipo de Evaluación</span>
    <button class="consultation-header__evaluation-button" type="button">Examen de Ingreso</button>
  </div>
</header>

<section class="rips-summary" aria-label="Resumen RIPS">
  <article class="rips-summary__card">
    <div class="rips-summary__card-top">
      <p class="rips-summary__label">Registros este mes</p>
      <span class="rips-summary__icon rips-summary__icon--muted" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M4 3H14V15H4V3Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M6.5 7H11.5M6.5 10H11.5M6.5 13H9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </span>
    </div>
    <p class="rips-summary__value rips-summary__value--primary">
      {{ stats().monthlyRecords | number: '1.0-0' }}
    </p>
    <div class="rips-summary__progress" aria-hidden="true">
      <span [style.width.%]="stats().progressPercent"></span>
    </div>
  </article>

  <article class="rips-summary__card">
    <div class="rips-summary__card-top">
      <p class="rips-summary__label">Pendientes por Validar</p>
      <span class="rips-summary__icon rips-summary__icon--danger" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.4"/>
          <path d="M9 6V10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="9" cy="12.5" r="0.75" fill="currentColor"/>
        </svg>
      </span>
    </div>
    <p class="rips-summary__value rips-summary__value--danger">{{ stats().pendingValidation }}</p>
    <button class="rips-summary__link" type="button" (click)="attendNow.emit()">Atender ahora →</button>
  </article>

  <button class="rips-summary__action-card" type="button" (click)="validateInfo.emit()">
    <span class="rips-summary__action-icon" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <rect x="4" y="4" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8 11H14M11 8V14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </span>
    <span>
      <strong>Validar información</strong>
      <small>Ejecutar motor de reglas</small>
    </span>
  </button>

  <button class="rips-summary__action-card" type="button" (click)="exportFile.emit()">
    <span class="rips-summary__action-icon" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <path d="M6 3H16V19H6V3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M9 7H13M9 11H13M9 15H11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M11 12V19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M8.5 15.5H13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </span>
    <span>
      <strong>Exportar archivo</strong>
      <small>Formatos .txt / .json</small>
    </span>
  </button>
</section>

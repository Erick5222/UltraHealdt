<section class="billing">
  <uh-billing-header />

  @if (actionMessage()) {
    <p class="billing__feedback" role="status">{{ actionMessage() }}</p>
  }

  <section class="billing__panel">
    <uh-billing-toolbar
      [searchQuery]="searchQuery()"
      [statusFilter]="statusFilter()"
      (searchInput)="onSearchInput($event)"
      (statusFilterChange)="setStatusFilter($event)"
    />

    <uh-billing-table
      [invoices]="paginatedInvoices()"
      (invoiceAction)="onInvoiceAction($event)"
    />

    <uh-billing-pagination
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      [pageNumbers]="pageNumbers()"
      [label]="paginationLabel()"
      (pageChange)="goToPage($event)"
      (previous)="goPreviousPage()"
      (next)="goNextPage()"
    />

    <footer class="billing__export">
      <p class="billing__export-text">
        Exporta el listado filtrado de facturas en formato PDF para archivo o impresión.
      </p>
      <button class="billing__export-button" type="button" (click)="exportInvoicesPdf()">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M4 3H14V15H4V3Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M6.5 7H11.5M6.5 10H11.5M6.5 13H9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M9 11.5V15" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M7.5 13.5H10.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        EXPORTAR FACTURAS EN PDF
      </button>
    </footer>
  </section>
</section>

<header class="invoice-form-header">
  <div class="invoice-form-header__intro">
    <p class="invoice-form-header__eyebrow">
      <img src="/images/icons/Navigation/billing.svg" alt="" width="16" height="16" />
      <span>MÓDULO DE FACTURACIÓN</span>
    </p>
    <h1 class="invoice-form-header__title">
      {{ editMode() ? 'Editar Factura' : 'Nueva Factura' }}
      <span class="invoice-form-header__number">{{ invoiceNumber() }}</span>
    </h1>
  </div>

  <div class="invoice-form-header__actions">
    <a class="invoice-form-header__cancel" routerLink="/billing">CANCELAR</a>
    <button class="invoice-form-header__save" type="button" (click)="save.emit()">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M3 2.5H11L13.5 5V13.5H3V2.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M5.5 2.5V6H10.5V2.5" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M5.5 9.5H10.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      {{ editMode() ? 'ACTUALIZAR FACTURA' : 'GUARDAR FACTURA' }}
    </button>
  </div>
</header>

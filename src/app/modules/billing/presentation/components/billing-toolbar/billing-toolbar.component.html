<section class="billing-toolbar">
  <label class="billing-toolbar__search">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
      <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.5"/>
      <path d="M12.5 12.5L16 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <input
      type="search"
      placeholder="Buscar por número, paciente o empresa..."
      [value]="searchQuery()"
      (input)="searchInput.emit($event)"
    />
  </label>

  <label class="billing-toolbar__select-field">
    <span class="billing-toolbar__select-label">Estado DIAN</span>
    <select [value]="statusFilter()" (change)="onStatusFilterChange($event)">
      @for (filter of filters; track filter.value) {
        <option [value]="filter.value">{{ filter.label }}</option>
      }
    </select>
  </label>
</section>

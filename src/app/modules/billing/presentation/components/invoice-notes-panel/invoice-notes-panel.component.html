<section class="invoice-notes-panel">
  <h2 class="invoice-notes-panel__title">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
      <path d="M4 3H14V15H4V3Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M6.5 7H11.5M6.5 10H11.5M6.5 13H9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    NOTAS E INSTRUCCIONES
  </h2>

  <textarea
    class="invoice-notes-panel__textarea"
    rows="4"
    placeholder="Agregar observaciones para el cliente..."
    [value]="notes()"
    (input)="notesChange.emit($any($event.target).value)"
  ></textarea>

  <p class="invoice-notes-panel__hint">Estas notas aparecerán en el PDF impreso de la factura.</p>
</section>

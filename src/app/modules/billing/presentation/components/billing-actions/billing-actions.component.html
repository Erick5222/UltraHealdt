<div class="billing-actions">
  @if (showDetail()) {
    <button class="billing-actions__button" type="button" aria-label="Ver factura" (click)="emitAction('view', $event)">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <path d="M2 9C2 9 4.5 4 9 4C13.5 4 16 9 16 9C16 9 13.5 14 9 14C4.5 14 2 9 2 9Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        <circle cx="9" cy="9" r="2.25" stroke="currentColor" stroke-width="1.4"/>
      </svg>
    </button>
  }

  @if (showValidate()) {
    <button class="billing-actions__button" type="button" aria-label="Descargar XML" (click)="emitAction('xml', $event)">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <path d="M4 3H14V15H4V3Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M6.5 7H11.5M6.5 10H11.5M6.5 13H9.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </button>
  }

  @if (showSend()) {
    <button class="billing-actions__button" type="button" aria-label="Enviar factura" (click)="emitAction('send', $event)">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <path d="M2.5 9L15.5 3L12 15L9.5 10.5L2.5 9Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      </svg>
    </button>
  }

  @if (showValidate()) {
    <button class="billing-actions__button" type="button" aria-label="Validar estado DIAN" (click)="emitAction('validate', $event)">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <path d="M9 2L11.2 6.8L16.5 7.4L12.8 11.1L13.7 16.4L9 14L4.3 16.4L5.2 11.1L1.5 7.4L6.8 6.8L9 2Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
      </svg>
    </button>
  }

  @if (showCreditNote()) {
    <button class="billing-actions__button" type="button" aria-label="Nota crédito" (click)="emitAction('creditNote', $event)">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <rect x="3" y="3" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.4"/>
        <path d="M9 6V12M6 9H12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </button>
  }

  <button class="billing-actions__button" type="button" aria-label="Más acciones" (click)="emitAction('more', $event)">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
      <circle cx="9" cy="4.5" r="1.1" fill="currentColor"/>
      <circle cx="9" cy="9" r="1.1" fill="currentColor"/>
      <circle cx="9" cy="13.5" r="1.1" fill="currentColor"/>
    </svg>
  </button>
</div>

<section class="invoice-electronic-panel">
  <header class="invoice-electronic-panel__header">
    <div class="invoice-electronic-panel__icon" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <path d="M11 3C7.5 3 5 5.5 5 9C5 13 11 19 11 19C11 19 17 13 17 9C17 5.5 14.5 3 11 3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M8.5 9.5L10 11L13.5 7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div>
      <h2 class="invoice-electronic-panel__title">Facturación Electrónica</h2>
      <p class="invoice-electronic-panel__provider">Proveedor: {{ provider() }}</p>
    </div>
  </header>

  <label class="invoice-electronic-panel__checkbox">
    <input
      type="checkbox"
      [checked]="autoDianValidation()"
      (change)="autoDianValidationChange.emit($any($event.target).checked)"
    />
    <span>
      <strong>Validación DIAN Automática</strong>
      <small>Enviar a la DIAN tras guardar la factura</small>
    </span>
  </label>

  <div class="invoice-electronic-panel__status">
    <span>Estado del Web-Service</span>
    <span class="invoice-electronic-panel__status-value">
      <span class="invoice-electronic-panel__status-dot" aria-hidden="true"></span>
      Conectado
    </span>
  </div>

  <button class="invoice-electronic-panel__button" type="button" (click)="verifyResolution.emit()">
    VERIFICAR RESOLUCIÓN DIAN
  </button>
</section>
